version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rent_house_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rent_house_calendman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rent_house_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rent_house_calendman?schema=public
      JWT_SECRET: change-this-to-a-secure-secret-in-production
      JWT_EXPIRATION: 86400
      CORS_ORIGIN: http://localhost:3001
      PORT: 3000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASS: your-app-password
      SMTP_FROM: RentHouse CalendMan <noreply@renthouse-calendman.com>
      FRONTEND_URL: http://localhost:3001
      REMINDER_ENABLED: true
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rent_house_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
